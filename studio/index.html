<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OT Studio</title>
<style>
@font-face { font-family: "Instrument Serif"; src: url("/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); font-style: italic; }
@font-face { font-family: "Inter Tight"; src: url("/fonts/inter-tight-latin-300-normal.woff2") format("woff2"); font-weight: 300; }
@font-face { font-family: "Inter Tight"; src: url("/fonts/inter-tight-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Inter Tight"; src: url("/fonts/inter-tight-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
:root { --ink: #17130E; --ink2: #221D16; --ink3: #2E281F; --cream: #F7F1E6; --paper: #FDFBF7; --champagne: #EBDDB8; --honey: #D8BC7E; --bronze: #7A5E2C; --mute: rgba(247,241,230,.6); --rule: rgba(247,241,230,.12); --gold: linear-gradient(180deg,#F0E2BC,#D8BC7E); --sans: "Helvetica Neue","Inter Tight",Helvetica,Arial,sans-serif; --serif: "Instrument Serif",Georgia,serif; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 400 14.5px/1.5 var(--sans); color: var(--cream); background: var(--ink); -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: 58px 1fr; overflow: hidden; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
em { font-family: var(--serif); font-style: italic; color: var(--champagne); font-size: 1.15em; }
:focus-visible { outline: 2px solid var(--honey); outline-offset: 2px; border-radius: 6px; }

.bar { display: flex; align-items: center; gap: 18px; padding: 0 18px; border-bottom: 1px solid var(--rule); min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 500; letter-spacing: .02em; white-space: nowrap; }
.brand svg { height: 15px; fill: var(--cream); }
.brand span { color: var(--mute); font-weight: 400; }
.seg { display: flex; background: var(--ink2); border: 1px solid var(--rule); border-radius: 99px; padding: 3px; }
.seg button { padding: 6px 14px; border-radius: 99px; color: var(--mute); white-space: nowrap; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--cream); color: var(--ink); }
.seg button i { font-style: normal; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--bronze); margin-left: 6px; }
.pages { overflow-x: auto; scrollbar-width: none; }
.spacer { flex: 1; }
.ghost { padding: 7px 14px; border-radius: 99px; border: 1px solid var(--rule); font-size: 13px; white-space: nowrap; text-decoration: none; color: var(--cream); }
.ghost:hover { border-color: var(--honey); }
.ghost b { font-weight: 500; color: var(--honey); margin-left: 4px; }

.app { display: grid; grid-template-columns: 410px 1fr; min-height: 0; }
.chat { display: grid; grid-template-rows: 1fr auto; border-right: 1px solid var(--rule); min-height: 0; }
.log { overflow-y: auto; padding: 22px 18px 8px; display: flex; flex-direction: column; gap: 14px; }
.hello h1 { font-weight: 300; font-size: 30px; line-height: 1.1; letter-spacing: -.02em; margin: 18px 0 10px; }
.hello p { color: var(--mute); margin: 0 0 18px; }
.sugg { display: grid; gap: 8px; }
.sugg button { text-align: left; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 14px; color: var(--cream); }
.sugg button:hover { border-color: var(--honey); background: var(--ink2); }
.msg { max-width: 94%; }
.msg.user { align-self: flex-end; background: var(--cream); color: var(--ink); padding: 10px 14px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; }
.msg.user.rej::before { content: "Rejected"; display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--bronze); margin-bottom: 2px; }
.msg.agent { align-self: flex-start; background: var(--ink2); border: 1px solid var(--rule); padding: 14px; border-radius: 16px 16px 16px 4px; }
.msg.agent.err { border-color: rgba(216,188,126,.5); }
.msg.system { align-self: center; font-size: 12px; color: var(--mute); text-align: center; }
.msg p { margin: 0; }
.msg .skills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.msg .skills span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--honey); border: 1px solid rgba(216,188,126,.4); border-radius: 99px; padding: 3px 9px; }
.label { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--honey); margin: 14px 0 6px; }
.changes { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.changes li { padding-left: 12px; border-left: 1px solid var(--honey); }
.changes span { display: block; color: var(--mute); font-size: 13px; }
.learned { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(216,188,126,.12); border: 1px solid rgba(216,188,126,.4); }
.learned .label { margin-top: 0; }
.learned p + p, .plain p + p { margin-top: 4px; }
.plain { color: var(--mute); font-size: 13px; }
.dots { display: flex; align-items: center; gap: 10px; color: var(--mute); }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--honey); animation: pulse 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes pulse { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.composer { padding: 12px 14px 16px; }
.box { display: flex; align-items: flex-end; gap: 8px; background: var(--ink2); border: 1px solid var(--rule); border-radius: 18px; padding: 8px 8px 8px 14px; }
.box:focus-within { border-color: var(--honey); }
.box textarea { flex: 1; resize: none; border: 0; outline: 0; background: none; max-height: 140px; padding: 6px 0; }
.box textarea::placeholder { color: var(--mute); }
.go { width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: var(--ink); display: grid; place-items: center; flex: none; }
.go:disabled { opacity: .35; cursor: default; }
.hint { color: var(--mute); font-size: 12px; margin: 8px 4px 0; }

.stage { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; background: var(--ink2); }
.status { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--rule); min-height: 56px; flex-wrap: wrap; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); flex: none; }
.status.draft .dot { background: var(--honey); box-shadow: 0 0 0 4px rgba(216,188,126,.25); }
.status.ready .dot { background: #9BC49B; }
.status strong { font-weight: 500; }
.status .sub { color: var(--mute); }
.checks { display: flex; gap: 6px; flex-wrap: wrap; }
.checks span { font-size: 11.5px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--rule); color: var(--mute); white-space: nowrap; }
.checks span.ok::before { content: "✓ "; color: #9BC49B; }
.checks span.warn { border-color: rgba(216,188,126,.6); color: var(--champagne); }
.btn { padding: 9px 18px; border-radius: 99px; font-weight: 500; white-space: nowrap; }
.btn.gold { background: var(--gold); color: var(--ink); }
.btn.line { border: 1px solid var(--rule); }
.btn.line:hover { border-color: var(--honey); }
.btn:disabled { opacity: .4; cursor: default; }
.rejbox { display: flex; gap: 8px; flex: 1 1 100%; }
.rejbox input { flex: 1; background: var(--ink); border: 1px solid var(--honey); border-radius: 99px; padding: 9px 16px; outline: 0; }
.frames { display: flex; gap: 12px; padding: 12px; min-height: 0; min-width: 0; }
.pane { flex: 1; min-width: 0; display: grid; grid-template-rows: auto 1fr; border-radius: 14px; overflow: hidden; background: var(--paper); border: 1px solid var(--rule); }
.pane header { display: flex; justify-content: space-between; align-items: center; padding: 7px 14px; background: var(--ink3); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.pane header b { font-weight: 500; color: var(--champagne); }
.pane.new header b { color: var(--honey); }
.scale { position: relative; overflow: hidden; min-height: 0; }
.scale iframe { border: 0; width: 100%; height: 100%; display: block; background: var(--paper); transform-origin: 0 0; }
.frames.mobile { justify-content: center; }
.frames.mobile .pane { flex: 0 0 390px; }

.drawer { position: fixed; inset: 58px 0 0 auto; width: min(430px, 100vw); background: var(--ink); border-left: 1px solid var(--rule); transform: translateX(100%); transition: transform .25s ease-out; display: grid; grid-template-rows: auto 1fr auto; z-index: 5; box-shadow: -30px 0 60px -30px rgba(0,0,0,.8); }
.drawer.open { transform: none; }
.drawer > header { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 20px 12px; }
.drawer h2 { margin: 0; font-weight: 300; font-size: 26px; letter-spacing: -.02em; }
.drawer .body { overflow-y: auto; padding: 4px 20px 20px; display: grid; gap: 10px; align-content: start; }
.drawer footer { padding: 14px 20px; border-top: 1px solid var(--rule); color: var(--mute); font-size: 12px; }
.card { border: 1px solid var(--rule); border-radius: 14px; padding: 14px; }
.card.live { border-color: rgba(155,196,155,.6); }
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 500; display: flex; gap: 8px; align-items: center; }
.tag { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--rule); color: var(--mute); font-weight: 400; }
.tag.live { color: #9BC49B; border-color: rgba(155,196,155,.6); }
.card p { margin: 0; }
.card .when { color: var(--mute); font-size: 12px; margin-top: 2px; }
.card .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.card .row button { font-size: 12.5px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--rule); }
.card .row button:hover { border-color: var(--honey); }
.empty { color: var(--mute); padding: 20px 0; }
.link { color: var(--mute); text-decoration: underline; text-underline-offset: 3px; font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--cream); color: var(--ink); padding: 10px 18px; border-radius: 99px; font-size: 13px; z-index: 9; box-shadow: 0 20px 40px -10px rgba(0,0,0,.6); }
@media (max-width: 980px) { body { overflow: auto; grid-template-rows: auto auto; } .bar { flex-wrap: wrap; padding: 10px 14px; } .app { grid-template-columns: 1fr; } .chat { border-right: 0; height: 70vh; } .stage { height: 90vh; } .frames { flex-direction: column; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><svg viewBox="0 0 66 26" aria-label="OT"><path fill-rule="evenodd" d="M13 0h6a13 13 0 0 1 0 26h-6a13 13 0 0 1 0-26zm1 8.5a4.5 4.5 0 0 0 0 9h4a4.5 4.5 0 0 0 0-9z"/><path d="M35 0h31v8.5H55.5V26h-10V8.5H35z"/></svg> Studio <span id="who"></span></div>
  <div class="seg pages" id="pages" role="group" aria-label="Page"></div>
  <div class="seg" id="views" role="group" aria-label="View"></div>
  <div class="seg" id="device" role="group" aria-label="Screen size"></div>
  <div class="spacer"></div>
  <button class="ghost" id="bLearn">What I’ve learned<b id="nLearn"></b></button>
  <button class="ghost" id="bVers">Versions<b id="nVers"></b></button>
  <a class="ghost" id="liveLink" target="_blank" rel="noopener" hidden>Live site ↗</a>
</header>

<div class="app">
  <aside class="chat">
    <div class="log" id="log" aria-live="polite"></div>
    <form class="composer" id="form">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Tell me what you want changed" aria-label="Message the agent"></textarea>
        <button class="go" id="send" aria-label="Send"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 13V3M4 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <p class="hint" id="hint">Nothing goes live until you approve it and push it.</p>
    </form>
  </aside>
  <main class="stage">
    <div class="status" id="status"></div>
    <div class="frames" id="frames"></div>
  </main>
</div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <header><h2 id="dTitle"></h2><button class="link" id="dClose">Close</button></header>
  <div class="body" id="dBody"></div>
  <footer id="dFoot"></footer>
</aside>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = (iso) => new Date(iso).toLocaleString([], { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });

let S = null, page = '/', view = 'live', device = 'desktop', peek = null, drawer = null, waiting = false, started = 0, rejecting = false, stamp = 0;

async function call(name, body) {
  const res = await fetch('/api/' + name, { method: name === 'state' ? 'GET' : 'POST', headers: { 'Content-Type': 'application/json' }, body: name === 'state' ? undefined : JSON.stringify(body || {}) });
  if (res.status === 401) return location.reload();
  const data = await res.json();
  if (data.error) toast(data.error);
  if (data.state || name === 'state') { S = data.state || data; stamp++; }
  return data;
}

function toast(text) {
  document.querySelector('.toast')?.remove();
  const t = Object.assign(document.createElement('div'), { className: 'toast', textContent: text });
  document.body.append(t);
  setTimeout(() => t.remove(), 4200);
}

function seg(el, items, current, pick) {
  el.innerHTML = items.map((i) => `<button data-v="${esc(i.v)}" aria-pressed="${i.v === current}">${esc(i.label)}${i.note ? `<i>${esc(i.note)}</i>` : ''}</button>`).join('');
  el.onclick = (e) => { const b = e.target.closest('button'); if (b) pick(b.dataset.v); };
}

function draw() {
  if (!S) return;
  if (!S.pages.some((p) => p.path === page)) page = '/';
  $('who').textContent = '· OTMENS';
  seg($('pages'), S.pages.map((p) => ({ v: p.path, label: p.key === 'home' ? 'Home' : p.key.replace(/-/g, ' ').replace(/^./, (c) => c.toUpperCase()), note: p.isNew ? 'new' : '' })), page, (v) => { page = v; draw(); });
  seg($('views'), [{ v: 'live', label: 'Current site' }, { v: 'draft', label: S.draft ? 'Updated draft' : 'Updated' }, { v: 'split', label: 'Side by side' }], peek ? '' : view, (v) => { view = v; peek = null; draw(); });
  seg($('device'), [{ v: 'desktop', label: 'Desktop' }, { v: 'mobile', label: 'Phone' }], device, (v) => { device = v; draw(); });
  $('nLearn').textContent = S.memory.length || '';
  $('nVers').textContent = S.versions.length;
  if (S.liveSiteUrl) { $('liveLink').hidden = false; $('liveLink').href = S.liveSiteUrl; }
  drawStatus(); drawFrames(); drawChat(); drawDrawer();
  $('send').disabled = waiting;
  $('hint').textContent = S.hasKey ? 'Nothing goes live until you approve it and push it.' : 'The agent has no API key yet, so it cannot answer.';
}

function drawStatus() {
  const el = $('status');
  if (peek) {
    el.className = 'status';
    el.innerHTML = `<span class="dot"></span><span><strong>Viewing version ${peek}</strong> <span class="sub">${esc(S.versions.find((v) => v.n === peek)?.summary)}</span></span><span class="spacer"></span><button class="btn line" data-a="unpeek">Back to the draft view</button>`;
  } else if (S.draft) {
    const r = S.draft.report || { checks: [], newNumbers: [], markers: [] };
    const blocked = r.markers.length > 0;
    el.className = 'status draft';
    el.innerHTML = `<span class="dot"></span><span><strong>Draft</strong> <span class="sub">${esc(S.draft.summary)}</span></span>
      <span class="checks">${r.checks.map((c) => `<span class="${c.ok ? 'ok' : 'warn'}" title="${esc(c.detail)}">${esc(c.name)}</span>`).join('')}
      ${r.newNumbers.length ? `<span class="warn" title="Figures that are not on the current site. Check they are right before approving.">New figures to check: ${esc(r.newNumbers.join(', '))}</span>` : ''}
      ${blocked ? '<span class="warn">Needs your input before it can be approved</span>' : ''}</span>
      <span class="spacer"></span>
      ${rejecting ? `<form class="rejbox" id="rej"><input id="why" placeholder="What’s wrong with it? The agent will learn from this." autocomplete="off"><button class="btn gold">Send back</button><button type="button" class="btn line" data-a="cancelrej">Cancel</button></form>`
        : `<button class="btn line" data-a="discard">Discard</button><button class="btn line" data-a="reject">Reject</button><button class="btn gold" data-a="approve" ${blocked || waiting ? 'disabled' : ''}>Approve</button>`}`;
    if (rejecting) { $('why').focus(); $('rej').onsubmit = (e) => { e.preventDefault(); const v = $('why').value.trim(); if (v) { rejecting = false; sendMsg(v, true); } }; }
  } else if (S.head !== S.live) {
    el.className = 'status ready';
    el.innerHTML = `<span class="dot"></span><span><strong>Version ${S.head} is approved</strong> <span class="sub">but not live. The live site is still version ${S.live}.</span></span><span class="spacer"></span><button class="btn gold" data-a="push">Push to live site</button>`;
  } else {
    el.className = 'status';
    el.innerHTML = `<span class="dot" style="background:#9BC49B"></span><span><strong>Version ${S.live} is live.</strong> <span class="sub">Ask for a change to start a draft.</span></span>`;
  }
}

$('status').onclick = async (e) => {
  const a = e.target.closest('[data-a]')?.dataset.a;
  if (!a) return;
  if (a === 'reject') rejecting = true;
  else if (a === 'cancelrej') rejecting = false;
  else if (a === 'unpeek') peek = null;
  else if (a === 'approve') { await call('approve'); view = 'split'; }
  else if (a === 'discard') { await call('discard'); view = 'live'; }
  else if (a === 'push') { await call('push'); view = 'live'; toast('Live. The public site now shows this version.'); }
  draw();
};

let frameKey = '';
function drawFrames() {
  const which = peek ? [['v' + peek, 'Version ' + peek, '']] :
    view === 'live' ? [['live', 'Current site · version ' + S.live, '']] :
    view === 'draft' ? [['draft', S.draft ? 'Updated draft' : 'Latest approved · version ' + S.head, 'new']] :
    [['live', 'Current site · version ' + S.live, ''], ['draft', S.draft ? 'Updated draft' : 'Latest approved · version ' + S.head, 'new']];
  const key = JSON.stringify([which, page, device, stamp]);
  if (key === frameKey) return;
  frameKey = key;
  const f = $('frames');
  f.className = 'frames' + (device === 'mobile' ? ' mobile' : '');
  f.innerHTML = which.map(([w, label, cls]) => `<section class="pane ${cls}"><header><b>${esc(label)}</b><span>${esc(page)}</span></header><div class="scale"><iframe title="${esc(label)}" src="/view/${w}${esc(page)}${which.length > 1 ? '?scroll=0' : ''}"></iframe></div></section>`).join('');
  fit();
  // Side by side: scrolling one pane scrolls the other to the same place.
  const frames = [...f.querySelectorAll('iframe')];
  if (frames.length === 2) {
    let lock = null;
    frames.forEach((fr, i) => fr.addEventListener('load', () => {
      const win = fr.contentWindow, other = frames[1 - i];
      win.addEventListener('scroll', () => {
        if (lock === other) return;
        lock = fr;
        try {
          const a = win.document.documentElement, b = other.contentDocument.documentElement;
          other.contentWindow.scrollTo(0, (win.scrollY / Math.max(1, a.scrollHeight - win.innerHeight)) * (b.scrollHeight - other.contentWindow.innerHeight));
        } catch {}
        clearTimeout(win.__t); win.__t = setTimeout(() => { lock = null; }, 80);
      }, { passive: true });
    }));
  }
}
function fit() {
  document.querySelectorAll('.scale').forEach((box) => {
    const frame = box.firstElementChild, w = box.clientWidth, target = device === 'mobile' ? 390 : 1280;
    const k = Math.min(1, w / target);
    frame.style.width = (k < 1 ? target : w) + 'px';
    frame.style.height = box.clientHeight / k + 'px';
    frame.style.transform = k < 1 ? `scale(${k})` : '';
  });
}
new ResizeObserver(fit).observe($('frames'));

const SKILL_NAMES = { copywriting: 'Copy', design: 'Design', 'flow-building': 'Flow', development: 'Code' };
function drawChat() {
  const log = $('log');
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  let h = '';
  if (!S.chat.length) {
    h += `<div class="hello"><p class="label" style="margin:0">Your creative and dev team</p><h1>What should we <em>change?</em></h1><p>Say it the way you’d say it to a person. I’ll draft it on a copy of your site so you can compare before anything goes live.</p>
      <div class="sugg">${['Run a Black Friday promo', 'The homepage feels weak, make it hit harder', 'Make the pricing easier to understand at a glance'].map((s) => `<button type="button">${s}</button>`).join('')}</div></div>`;
  }
  for (const m of S.chat) {
    if (m.role === 'user') h += `<div class="msg user${m.rejected ? ' rej' : ''}">${esc(m.text)}</div>`;
    else if (m.role === 'system') h += `<div class="msg system">${esc(m.text)}</div>`;
    else h += `<div class="msg agent${m.error || m.failed ? ' err' : ''}">${m.skills?.length ? `<p class="skills">${m.skills.map((k) => `<span>${esc(SKILL_NAMES[k] || k)}</span>`).join('')}</p>` : ''}<p>${esc(m.text)}</p>
      ${m.learned?.length ? `<div class="learned"><p class="label">Learned</p>${m.learned.map((l) => `<p>${esc(l)}</p>`).join('')}</div>` : ''}
      ${m.changes?.length && m.drafted ? `<p class="label">What changed</p><ul class="changes">${m.changes.map((c) => `<li>${esc(c.what)}<span>${esc(c.why)}</span></li>`).join('')}</ul>` : ''}
      ${m.applied?.length ? `<p class="label">Applied from what I’ve learned</p><div class="plain">${m.applied.map((l) => `<p>${esc(l)}</p>`).join('')}</div>` : ''}
      ${m.needs?.length ? `<p class="label">I need from you</p><div class="plain">${m.needs.map((l) => `<p>${esc(l)}</p>`).join('')}</div>` : ''}
      ${m.declined?.length ? `<p class="label">I didn’t do</p><div class="plain">${m.declined.map((l) => `<p>${esc(l)}</p>`).join('')}</div>` : ''}</div>`;
  }
  if (waiting) h += `<div class="msg agent"><div class="dots"><i></i><i></i><i></i><span id="tick">Working on it</span></div></div>`;
  log.innerHTML = h;
  if (stick || waiting) log.scrollTop = log.scrollHeight;
}
$('log').onclick = (e) => { const b = e.target.closest('.sugg button'); if (b) sendMsg(b.textContent); };
setInterval(() => { const t = $('tick'); if (t && waiting) t.textContent = `Working on it · ${Math.round((Date.now() - started) / 1000)}s`; }, 1000);

const pause = (ms) => new Promise((r) => setTimeout(r, ms));

// The server answers at once and works in the background; keep checking until it is done.
async function waitForAgent() {
  waiting = true; draw();
  let misses = 0;
  while (S.busy && misses < 20) {
    await pause(1500);
    try { await call('state'); misses = 0; } catch { misses++; }
  }
  waiting = false;
  if (misses >= 20) toast('Lost the connection. Reload the page to see the result.');
}

async function sendMsg(text, rejected) {
  if (waiting || !text.trim()) return;
  waiting = true; started = Date.now();
  const before = S.chat.length;
  S.chat.push({ role: 'user', text, rejected: !!rejected });
  draw();
  try {
    const res = await call('chat', { message: text, rejected: !!rejected });
    if (!res?.error) await waitForAgent();
  } catch (e) {
    await pause(1500);
    await call('state').catch(() => {});
    if (S.busy) await waitForAgent(); else toast('That didn’t send. Check your connection and try again.');
  }
  const last = S.chat[S.chat.length - 1];
  if (S.chat.length > before && last?.drafted) { if (view === 'live') view = 'split'; peek = null; }
  waiting = false;
  draw();
}
$('form').onsubmit = (e) => { e.preventDefault(); const v = $('input').value; $('input').value = ''; $('input').style.height = ''; sendMsg(v); };
$('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } };
$('input').oninput = (e) => { e.target.style.height = ''; e.target.style.height = e.target.scrollHeight + 'px'; };

let confirmReset = false;
function drawDrawer() {
  const d = $('drawer');
  d.classList.toggle('open', !!drawer);
  d.setAttribute('aria-hidden', String(!drawer));
  if (drawer === 'versions') {
    $('dTitle').innerHTML = 'Every <em>version.</em>';
    $('dBody').innerHTML = S.versions.map((v) => `<div class="card${v.n === S.live ? ' live' : ''}"><h3>Version ${v.n}${v.n === S.live ? '<span class="tag live">Live</span>' : ''}${v.n === S.head && v.n !== S.live ? '<span class="tag">Approved, not live</span>' : ''}</h3><p>${esc(v.summary)}</p><p class="when">Saved ${when(v.createdAt)}${v.pushedAt ? ' · last pushed live ' + when(v.pushedAt) : ''}</p>
      <div class="row"><button data-a="peek" data-n="${v.n}">View</button>${v.n !== S.live ? `<button data-a="push" data-n="${v.n}">Push to live site</button>` : ''}${v.n !== S.head ? `<button data-a="restore" data-n="${v.n}">Restore as newest</button>` : ''}</div></div>`).join('');
    $('dFoot').innerHTML = `Every approved change is kept here. <button class="link" data-a="reset">${confirmReset ? 'Click again to wipe everything and start the demo over' : 'Reset the demo'}</button>`;
  } else if (drawer === 'learned') {
    $('dTitle').innerHTML = 'What I’ve <em>learned.</em>';
    $('dBody').innerHTML = S.memory.length ? S.memory.slice().reverse().map((m) => `<div class="card"><p>${esc(m.rule)}</p><p class="when">${when(m.at)} · from “${esc(m.from)}”</p><div class="row"><button data-a="forget" data-id="${esc(m.id)}">Forget this</button></div></div>`).join('')
      : '<p class="empty">Nothing yet. When you reject a draft and say why, the rule I take from it shows up here, and I follow it from then on.</p>';
    $('dFoot').textContent = 'These rules are sent to the agent with every request.';
  }
}
$('drawer').onclick = async (e) => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a, n = Number(b.dataset.n);
  if (a === 'peek') { peek = n; drawer = null; }
  else if (a === 'push') { await call('push', { n }); toast(`Version ${n} is live.`); }
  else if (a === 'restore') await call('restore', { n });
  else if (a === 'forget') await call('forget', { id: b.dataset.id });
  else if (a === 'reset') { if (!confirmReset) confirmReset = true; else { confirmReset = false; await call('reset'); view = 'live'; peek = null; drawer = null; } }
  draw();
};
$('bVers').onclick = () => { drawer = drawer === 'versions' ? null : 'versions'; confirmReset = false; draw(); };
$('bLearn').onclick = () => { drawer = drawer === 'learned' ? null : 'learned'; draw(); };
$('dClose').onclick = () => { drawer = null; draw(); };
document.onkeydown = (e) => { if (e.key === 'Escape' && drawer) { drawer = null; draw(); } };

call('state').then(async () => { if (S.draft) view = 'split'; draw(); if (S.busy) { started = Date.now(); await waitForAgent(); draw(); } });
</script>
</body>
</html>
